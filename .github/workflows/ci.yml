name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CMake
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build --config Release --parallel
            test: ctest --test-dir build --output-on-failure
          - name: macOS CMake
            os: macos-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build --config Release --parallel
            test: ctest --test-dir build --output-on-failure
          - name: Windows CMake
            os: windows-latest
            configure: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
            build: cmake --build build --config Release --parallel
            test: ctest --test-dir build -C Release --output-on-failure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.test }}

  web-check:
    name: Web syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check apps/streamview-web/server.js
          node --check apps/streamview-web/public/app.js

  core-no-optional-deps:
    name: Core without optional FFmpeg modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTREAMVIEW_ENABLE_FFMPEG=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
